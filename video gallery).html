<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Infinite Video Arc Gallery</title>
    
    <!-- GSAP for Smooth Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        @import url('https://fonts.cdnfonts.com/css/pp-neue-montreal');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PP Neue Montreal', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* The main container for the slides */
        .gallery-wrapper {
            position: relative;
            width: 100%;
            height: 70vh;
            overflow: hidden;
            cursor: grab;
            perspective: 1000px;
        }

        .gallery-wrapper:active {
            cursor: grabbing;
        }

        /* Individual Card Style */
        .video-card {
            position: absolute;
            width: 320px;
            height: 480px;
            border-radius: 20px;
            overflow: hidden;
            background: #111;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            will-change: transform, opacity, filter;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            filter: grayscale(40%) contrast(1.1);
            transition: filter 0.5s ease;
        }

        /* Highlight the active video */
        .video-card.active video {
            filter: grayscale(0%) contrast(1.2);
        }

        /* UI Elements */
        .interface {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 1000;
            width: 100%;
            pointer-events: none;
        }

        #active-title {
            font-size: 3.5rem;
            font-weight: 500;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(to bottom, #fff, #666);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .review-btn {
            pointer-events: auto;
            background: #fff;
            color: #000;
            border: none;
            padding: 18px 50px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 100px;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .review-btn:hover {
            background: #00ffcc;
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 255, 204, 0.3);
        }

        .scroll-hint {
            position: fixed;
            top: 50px;
            width: 100%;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="scroll-hint">Use Mouse Wheel or Drag to Rotate</div>

    <div class="gallery-wrapper" id="gallery">
        <!-- Videos will be injected here -->
    </div>

    <div class="interface">
        <h2 id="active-title">GALLERY</h2>
        <button class="review-btn" onclick="triggerReview()">Review Selection</button>
    </div>

    <script>
        // Configuration
        const CARD_GAP = 360;
        const ARC_INTENSITY = 280; // How deep the "V" or "Arc" curve is
        const SCALE_REDUCTION = 0.6; // How much smaller side cards get
        const LERP_SPEED = 0.06; // Smoothing speed

        // Data with High Quality Stock Videos (Pexels CDN)
        const videoData = [
            { id: 1, title: "Neon City", url: "https://videos.pexels.com/video-files/3126938/3126938-uhd_2560_1440_25fps.mp4" },
            { id: 2, title: "Ocean Mist", url: "https://videos.pexels.com/video-files/853889/853889-hd_1920_1080_25fps.mp4" },
            { id: 3, title: "Deep Forest", url: "https://videos.pexels.com/video-files/18151522/18151522-uhd_2560_1440_30fps.mp4" },
            { id: 4, title: "Sky Flow", url: "https://videos.pexels.com/video-files/20340803/20340803-uhd_2560_1440_30fps.mp4" },
            { id: 5, title: "Cyber Punk", url: "https://videos.pexels.com/video-files/3126514/3126514-uhd_2560_1440_25fps.mp4" },
            { id: 6, title: "Abstract", url: "https://videos.pexels.com/video-files/5243681/5243681-uhd_2560_1440_25fps.mp4" },
            { id: 7, title: "Gold Dust", url: "https://videos.pexels.com/video-files/8474605/8474605-uhd_2560_1440_25fps.mp4" }
        ];

        const gallery = document.getElementById('gallery');
        const titleDisplay = document.getElementById('active-title');
        
        let slides = [];
        let scrollTarget = 0;
        let scrollCurrent = 0;
        let activeIndex = -1;
        
        const winWidth = window.innerWidth;
        const totalTrackWidth = videoData.length * CARD_GAP;

        // 1. Setup Gallery
        function createGallery() {
            videoData.forEach((data, i) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                const vid = document.createElement('video');
                vid.src = data.url;
                vid.loop = true;
                vid.muted = true;
                vid.playsInline = true;
                
                card.appendChild(vid);
                gallery.appendChild(card);
                slides.push({ el: card, video: vid, info: data });
            });

            animate();
        }

        // 2. Main Logic: Calculating the Arc
        function updatePositions() {
            scrollCurrent += (scrollTarget - scrollCurrent) * LERP_SPEED;

            let closestDist = Infinity;
            let currentFocusIdx = 0;

            slides.forEach((slide, i) => {
                // Infinite Loop Wrapping Math
                let offset = (i * CARD_GAP - scrollCurrent) % totalTrackWidth;
                if (offset > totalTrackWidth / 2) offset -= totalTrackWidth;
                if (offset < -totalTrackWidth / 2) offset += totalTrackWidth;

                // Distance from center (0 to 1+)
                const absDist = Math.abs(offset);
                const normalizedDist = absDist / (winWidth / 2);

                // Movement Math
                const x = (winWidth / 2) + offset - (160); // 160 is half card width
                
                // Parallax Arc: Y moves down as distance from center increases
                // Scale: Shrinks as distance increases
                const y = (window.innerHeight * 0.25) + (Math.pow(normalizedDist, 2) * ARC_INTENSITY);
                const scale = 1 - (Math.min(normalizedDist, 1) * SCALE_REDUCTION);
                const opacity = 1.3 - normalizedDist;

                // Apply with GSAP for sub-pixel smoothness
                gsap.set(slide.el, {
                    x: x,
                    y: y,
                    scale: scale,
                    opacity: opacity,
                    zIndex: Math.round(100 - absDist / 10),
                    rotateY: offset / 20 // Slight 3D rotation
                });

                // Track which card is in the center
                if (absDist < closestDist) {
                    closestDist = absDist;
                    currentFocusIdx = i;
                }
            });

            // 3. Focus & Video Playback Logic
            if (activeIndex !== currentFocusIdx) {
                activeIndex = currentFocusIdx;
                
                // Update UI
                titleDisplay.textContent = slides[activeIndex].info.title;

                slides.forEach((s, idx) => {
                    if (idx === activeIndex) {
                        s.el.classList.add('active');
                        s.video.play().catch(e => console.log("User interaction needed"));
                    } else {
                        s.el.classList.remove('active');
                        s.video.pause();
                        s.video.currentTime = 0; // Reset video
                    }
                });
            }
        }

        // 4. Input Handlers
        window.addEventListener('wheel', (e) => {
            scrollTarget += e.deltaY * 0.8;
        });

        // Drag functionality
        let isDragging = false;
        let startX = 0;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            gallery.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = startX - e.clientX;
            scrollTarget += deltaX * 2.5;
            startX = e.clientX;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            gallery.style.cursor = 'grab';
        });

        // 5. Review Function
        function triggerReview() {
            const active = slides[activeIndex].info;
            alert(`REVIEW OPTION:\nYou have selected: ${active.title.toUpperCase()}\nVideo ID: ${active.id}\nProceeding to full screen review...`);
        }

        function animate() {
            updatePositions();
            requestAnimationFrame(animate);
        }

        createGallery();

        // Handle Resizing
        window.addEventListener('resize', () => {
            location.reload(); 
        });
    </script>
</body>
</html>
